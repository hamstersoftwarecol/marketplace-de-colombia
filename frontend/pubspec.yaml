name: marketplace_web
description: A marketplace for local services in Colombia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Routing
  go_router: ^14.6.2
  
  # HTTP & API
  dio: ^5.7.0
  
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  
  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  
  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  
  # Utils
  intl: ^0.20.2
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  
  # Forms
  reactive_forms: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
